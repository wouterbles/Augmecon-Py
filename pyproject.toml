[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "augmecon-py"
version = "0.1.0"
description = "Reference Augmecon-R implementation (single-process, integer grid walk)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pyomo>=6.7",
    "openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["augmecon_py"]
